<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Luisinho Humor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Outfit', 'sans-serif'] },
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0f0f11;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: white;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md">
        <!-- Botão Voltar -->
        <a href="index.html" class="inline-flex items-center text-gray-400 hover:text-white mb-6 transition-colors text-sm font-medium">
            <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i> Voltar ao Início
        </a>

        <!-- Cartão de Contato -->
        <div class="glass-card rounded-3xl p-8 text-center relative overflow-hidden">
            <!-- Efeito de fundo -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>

            <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i data-lucide="mail" class="w-8 h-8 text-white"></i>
            </div>

            <h1 class="font-display font-bold text-3xl mb-2">Fale Comigo</h1>
            <p class="text-gray-400 text-sm mb-8">Para parcerias, publicidade e eventos.</p>

            <!-- Caixa do Email -->
            <div class="bg-black/30 rounded-xl p-4 mb-6 border border-white/5 relative group">
                <p class="text-xs text-gray-500 uppercase tracking-widest mb-1 font-bold">Email Comercial</p>
                <p id="email-text" class="text-white font-mono text-sm sm:text-base break-all selection:bg-purple-500">lvmr_the_best@outlook.com</p>
                
                <button onclick="copyEmail()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-white/10 hover:bg-white/20 rounded-lg transition-colors" title="Copiar Email">
                    <i data-lucide="copy" class="w-4 h-4 text-white"></i>
                </button>
            </div>

            <!-- Botão de Ação -->
            <a href="mailto:lvmr_the_best@outlook.com" class="block w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-gray-200 transition-colors">
                Enviar Email Agora
            </a>

            <div id="toast" class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-emerald-500 text-white text-xs font-bold py-2 px-4 rounded-full opacity-0 transition-opacity pointer-events-none">
                Email copiado!
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function copyEmail() {
            const email = document.getElementById('email-text').innerText;
            navigator.clipboard.writeText(email);
            
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2000);
        }
    </script>
</body>
</html>
